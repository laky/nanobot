x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ~/.nanobot:/root/.nanobot
  extra_hosts:
    - "host.docker.internal:host-gateway"
  devices:
    - /dev/dri/card1:/dev/dri/card1
    - /dev/dri/renderD128:/dev/dri/renderD128
  environment:
    - TZ=Europe/London
    - HSA_OVERRIDE_GFX_VERSION=11.0.3  # gfx1103 for Ryzen 7000 (780M/760M)

services:
  nanobot-personal:
    container_name: nanobot-personal
    <<: *common-config
    network_mode: host
    command: ["gateway", "-w", "/workspace", "-c", "/root/.nanobot/personal-config.json", "-p", "18790"]
    restart: unless-stopped
    volumes:
      - ~/.nanobot:/root/.nanobot
      - ~/.nanobot/personal_workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M

  nanobot-group:
    container_name: nanobot-group
    <<: *common-config
    network_mode: host
    command: ["gateway", "-w", "/workspace", "-c", "/root/.nanobot/group-config.json", "-p", "18791"]
    restart: unless-stopped
    volumes:
      - ~/.nanobot:/root/.nanobot
      - ~/.nanobot/group_workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
